# bondzee.live + bondzee.bond — artist stack (NOT brisasmarinas)
# Fix: HTTPS vhost must match HTTP root — Brisas bleed was wrong ssl root / catch-all.

server {
    listen 80;
    listen [::]:80;
    server_name bondzee.live www.bondzee.live bondzee.bond www.bondzee.bond;
    root /var/www/bondzee.live;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /zyn-shared/ {
        alias /var/www/zyn-shared/;
    }
    add_header X-Powered-By "ZYNTHIO-VDS" always;
}